name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q ./*.zip
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests
        working-directory: OzonShiftHunter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build APK
        working-directory: OzonShiftHunter
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OzonShiftHunter-debug-apk
          path: OzonShiftHunter/app/build/outputs/apk/debug/app-debug.apk
